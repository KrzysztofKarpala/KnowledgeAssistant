services:
  api:
    build:
      context: .
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/knowledge_assistant
      - OPENAI_BASE_URL=http://host.docker.internal:1234/v1
      - OPENAI_API_KEY=lm-studio
      - LLM_MODEL=google/gemma-4-e4b
      - EMBEDDING_MODEL=text-embedding-embeddinggemma-300m-qat
      - RERANKER_ENABLED=true
      - RERANKER_BASE_URL=http://host.docker.internal:8081/v1
      - RERANKER_MODEL=gpustack/bge-reranker-v2-m3-GGUF:Q4_K_M
      - RERANKER_CANDIDATE_LIMIT=50
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./main.py:/app/main.py
      - ./scripts:/app/scripts
      - ./seed:/app/seed
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - rag-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag-network

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  rag-network:
    driver: bridge
