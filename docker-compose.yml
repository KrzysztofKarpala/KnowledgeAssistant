services:
  api:
    build:
      context: .
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/knowledge_assistant
      - LM_STUDIO_URL=http://host.docker.internal:1234
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      - LLM_MODEL=google/gemma-4-e4b
      - EMBEDDING_BASE_URL=http://host.docker.internal:1234/v1
      - EMBEDDING_MODEL=text-embedding-embeddinggemma-300m-qat
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    networks:
      - rag-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag-network

volumes:
  postgres_data:
  ollama_data:

networks:
  rag-network:
    driver: bridge
